apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.deployment.name }}-migrate-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }} migration
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      name: {{ .Values.deployment.name }}-migrate-db
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }} migration
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-migrate-db
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Override the `python main.py` entrypoint — run alembic directly.
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: {{ .Values.deployment.name }}-backend
            - configMapRef:
                name: {{ .Values.deployment.name }}-api
          resources:
            {{- toYaml .Values.resources.migrateDb | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir: {}
