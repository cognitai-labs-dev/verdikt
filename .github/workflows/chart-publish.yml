name: Publish Helm Chart to GitHub Container Registry

on:
  push:
    branches:
      - master
    paths:
      - "chart/**"
  pull_request:
    paths:
      - "chart/**"

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: |
          helm lint chart/verdikt \
            --set image.repository=lint/backend \
            --set image.tag=lint \
            --set frontendImage.repository=lint/frontend \
            --set frontendImage.tag=lint \
            --set api.serviceBaseUrl=https://api.verdikt.example.com

  publish:
    if: github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to the Container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: helm package chart/verdikt

      - name: Push chart
        run: helm push verdikt-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository }}/charts
